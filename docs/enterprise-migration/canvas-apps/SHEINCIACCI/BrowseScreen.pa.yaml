# ==============================================================================
# Microsoft Power Apps Canvas Source Code (Power Fx YAML)
# Application: Incident & Accident Investigation Reporting (SHEINCIACCI)
# Department: Safety, Health & Environment
# Screen: BrowseScreen (Filterable Transaction Gallery)
# ==============================================================================

BrowseScreen As Screen:
  Properties:
    Fill: =RGBA(248, 250, 252, 1)
    OnVisible: |
      =UpdateContext({ locSearchQuery: "", locFilterStatus: "All" });
      ClearCollect(colSHEINCIACCIRecords,
          {
              ID: "SHE-2026-0089",
              Title: "Caustic Soda Unloading Line Flange Gasket Minor Chemical Seepage",
              Category: "Chemical Process Safety Incident",
              Submitter: "K. Balakrishnan (Senior Safety Officer)",
              Location: "Johor Pasir Gudang · Chemical Unloading Bay 3",
              Priority: "HIGH",
              Stage: "Stage 3: Plant Safety Manager Sign-off"
          }
      )
  Children:
    - conMainGallery As groupContainer.verticalAutoLayoutContainer:
        Properties:
          Width: =Parent.Width
          Height: =Parent.Height
          PaddingLeft: 32
          PaddingRight: 32
          PaddingTop: 24
        Children:
          - galItems As gallery.galleryVertical:
              Properties:
                Width: =Parent.Width - 64
                Height: 500
                Items: =colSHEINCIACCIRecords
                TemplateSize: 72
              Children:
                - btnViewDetails As button:
                    Properties:
                      Text: ="View Details →"
                      Fill: =ColorValue("#B45309")
                      Color: =RGBA(255, 255, 255, 1)
                      OnSelect: |
                        =Set(varSelectedSHEINCIACCI, ThisItem);
                        Navigate(DetailsScreen, ScreenTransition.Fade)
