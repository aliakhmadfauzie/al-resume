# ==============================================================================
# Microsoft Power Apps Canvas Source Code (Power Fx YAML)
# Application: Capital Appropriation Request (CAR)
# Department: Finance & Accounting
# Screen: DetailsScreen (Dossier & Workflow State Machine)
# ==============================================================================

DetailsScreen As Screen:
  Properties:
    Fill: =RGBA(248, 250, 252, 1)
  Children:
    - conCommandBar As groupContainer.horizontalAutoLayoutContainer:
        Properties:
          Height: 64
          Width: =Parent.Width
          Fill: =RGBA(255, 255, 255, 1)
          BorderColor: =RGBA(226, 232, 240, 1)
          BorderThickness: 1
        Children:
          - btnApprove As button:
              Properties:
                Text: ="✓ Approve & Dispatch"
                Fill: =ColorValue("#1E3A8A")
                Color: =RGBA(255, 255, 255, 1)
                OnSelect: |
                  =Notify("CAR Record Approved", NotificationType.Success);
                  Navigate(BrowseScreen, ScreenTransition.Cover)
    - conDetailDossier As groupContainer.horizontalAutoLayoutContainer:
        Properties:
          Width: =Parent.Width
          Height: =Parent.Height - 112
        Children:
          - conLeftInfo As groupContainer.verticalAutoLayoutContainer:
              Properties:
                Width: =Parent.Width * 0.65
          - conRightWorkflow As groupContainer.verticalAutoLayoutContainer:
              Properties:
                Width: =Parent.Width * 0.35
