                            - btnRowAction As button:
                                Properties:
                                  Text: ="View Dossier →"
                                  Fill: =RGBA(248, 250, 252, 1)
                                  Color: =RGBA(0, 108, 76, 1)
                                  BorderColor: =RGBA(203, 213, 225, 1)
                                  BorderThickness: 1
                                  FontWeight: =FontWeight.Bold
                                  Size: 11.5
                                  Height: 34
                                  PaddingLeft: 12
                                  PaddingRight: 12
                                  RadiusTopLeft: 6
                                  RadiusTopRight: 6
                                  RadiusBottomLeft: 6
                                  RadiusBottomRight: 6
                                  OnSelect: |
                                    =Set(varSelectedRecord, ThisItem);
                                    Navigate(DetailsScreen, ScreenTransition.Fade)
