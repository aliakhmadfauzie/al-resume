                      BorderColor: =RGBA(226, 232, 240, 1)
                      BorderThickness: 1
                      RadiusTopLeft: 8
                      RadiusTopRight: 8
                      RadiusBottomLeft: 8
                      RadiusBottomRight: 8
                      Items: |
                        =Filter(colDemoRequests,
                            (IsBlank(locSearchQuery) Or locSearchQuery in Title Or locSearchQuery in ID Or locSearchQuery in Submitter)
                        )
                      TemplateSize: 72
                      TemplatePadding: 0

                    Children:
                      - conRowItem As groupContainer.horizontalAutoLayoutContainer:
