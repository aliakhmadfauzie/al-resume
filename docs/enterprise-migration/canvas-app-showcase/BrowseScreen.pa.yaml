              Title: "SAP S/4HANA Transport Request (TR-84920)",
              Subcategory: "ERP Core · Commercial Logistics Dispatch Module",
              Submitter: "Siti Nurhaliza",
              SubmitterRole: "Supply Chain Exec",
              Plant: "Penang HQ",
              Priority: "HIGH",
              SubmittedDate: "Yesterday, 16:30",
              Stage: "IT Security Triage",
              StageCode: 2,
              StatusColor: RGBA(180, 83, 9, 1),
              StatusFill: RGBA(255, 251, 235, 1)
