                                        FontWeight: =FontWeight.Semibold
                                        Color: =RGBA(15, 23, 42, 1)
                                        Size: 12
                                  - lblRowPlant As label:
                                      Properties:
                                        Text: =ThisItem.Plant
                                        Color: =RGBA(100, 116, 139, 1)
                                        Size: 10.5

                            - conColStage As groupContainer.verticalAutoLayoutContainer:
