                      Fill: =RGBA(255, 255, 255, 1)
                      Color: =RGBA(71, 85, 105, 1)
                      FontWeight: =FontWeight.Semibold
                      Size: 12
                      Height: 38
                      Width: =Parent.Width - 28
                      RadiusTopLeft: 6
                      RadiusTopRight: 6
                      RadiusBottomLeft: 6
                      RadiusBottomRight: 6

