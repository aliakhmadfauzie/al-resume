                      FontWeight: =FontWeight.Bold
                      Size: 12
                      Height: 38
                      Width: =Parent.Width - 28
                      RadiusTopLeft: 6
                      RadiusTopRight: 6
                      RadiusBottomLeft: 6
                      RadiusBottomRight: 6

