                            RadiusTopRight: 10
                            RadiusBottomLeft: 10
                            RadiusBottomRight: 10
                            PaddingLeft: 16
                            PaddingRight: 16
                            PaddingTop: 14
                            PaddingBottom: 14
                            LayoutGap: 4
                          Children:
                            - lblKpi2Title As label:
