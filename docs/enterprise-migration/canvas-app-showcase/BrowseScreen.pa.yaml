                                  Color: =RGBA(4, 120, 87, 1)

                # Filter Search Bar
                - conFilterToolbar As groupContainer.horizontalAutoLayoutContainer:
                    Properties:
                      Width: =Parent.Width - 64
                      Fill: =RGBA(255, 255, 255, 1)
                      BorderColor: =RGBA(226, 232, 240, 1)
                      BorderThickness: 1
                      RadiusTopLeft: 8
                      RadiusTopRight: 8
                      RadiusBottomLeft: 8
                      RadiusBottomRight: 8
                      PaddingLeft: 14
                      PaddingRight: 14
                      PaddingTop: 10
                      PaddingBottom: 10
                      LayoutGap: 12
                      LayoutAlignItems: =LayoutAlignItems.Center
                    Children:
                      - txtSearchInput As textInput:
                          Properties:
                            HintText: ="Search by Request ID, Submitter, Asset Tag..."
