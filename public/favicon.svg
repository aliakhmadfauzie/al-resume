<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1828" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#0e1017" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="1" />
    </radialGradient>
    
    <!-- Accent Orange/Amber Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Hexagonal / Rounded Shield Conduit Ring -->
  <polygon points="256,24 456,120 456,392 256,488 56,392 56,120"
           fill="#0d0f17"
           stroke="url(#ringGrad)"
           stroke-width="7"
           stroke-linejoin="round" />

  <!-- Inner Architectural Grid / Circuit Lines -->
  <line x1="256" y1="24" x2="256" y2="130" stroke="#f97316" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4,6" />
  <line x1="256" y1="382" x2="256" y2="488" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4,6" />
  
  <line x1="56" y1="120" x2="150" y2="175" stroke="#f97316" stroke-width="2" stroke-opacity="0.3" />
  <line x1="456" y1="120" x2="362" y2="175" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" />
  <line x1="56" y1="392" x2="150" y2="337" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" />
  <line x1="456" y1="392" x2="362" y2="337" stroke="#f97316" stroke-width="2" stroke-opacity="0.3" />

  <!-- Circuit Synapse Pulse Nodes -->
  <circle cx="256" cy="130" r="5" fill="#f97316" filter="url(#glowFilter)" />
  <circle cx="256" cy="382" r="5" fill="#06b6d4" filter="url(#glowFilter)" />
  <circle cx="150" cy="175" r="4" fill="#f97316" />
  <circle cx="362" cy="175" r="4" fill="#06b6d4" />
  <circle cx="150" cy="337" r="4" fill="#06b6d4" />
  <circle cx="362" cy="337" r="4" fill="#f97316" />

  <!-- Monogram Lockup Group: < / > Architectural Emblem -->
  <g filter="url(#intenseGlow)">
    <!-- Left Chevron '<' -->
    <path d="M 195 185 L 125 256 L 195 327"
          fill="none"
          stroke="url(#orangeGrad)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Center Forward Slash '/' -->
    <path d="M 285 155 L 227 357"
          fill="none"
          stroke="url(#cyanGrad)"
          stroke-width="22"
          stroke-linecap="round" />

    <!-- Right Chevron '>' -->
    <path d="M 317 185 L 387 256 L 317 327"
          fill="none"
          stroke="url(#orangeGrad)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Central Kinetic Micro-Core (Pulse Dot) -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#glowFilter)" />
</svg>