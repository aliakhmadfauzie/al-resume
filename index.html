<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Ali Akhmad Fauzie, B.I.B.M. (Hons.) | Power Platform Solution Architect & Enterprise Modernization</title>
    <meta name="description" content="Portfolio of Ali Akhmad Fauzie, B.I.B.M. (Hons.) - Senior Power Platform Solution Architect & Enterprise Modernization Specialist with 9+ years experience migrating legacy systems and delivering intelligent automation." />
    
    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ali Fauzie" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- OpenGraph & Social Sharing -->
    <meta property="og:title" content="Ali Akhmad Fauzie, B.I.B.M. (Hons.) | Enterprise Solution Architect" />
    <meta property="og:description" content="Enterprise Solution Architecture, Power Platform & Full-Stack Modernization Portfolio of Ali Akhmad Fauzie, B.I.B.M. (Hons.)." />
    <meta property="og:image" content="/assets/branding/pwa-512x512.png" />
    <meta property="og:type" content="website" />
    
    <!-- Preconnect to Font Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Preload Hero LCP Candidate Image for Instant Paint (Zero Resource Delay) -->
    <link rel="preload" as="image" href="/assets/profile/ali-avatar.jpg" fetchpriority="high">

    <!-- Google Fonts: Plus Jakarta Sans & Fira Code with swap display -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0a0b0d] text-[#f8fafc] antialiased selection:bg-[#2563eb] selection:text-white min-h-screen overflow-x-hidden">
    <div id="root">
      <!-- Instant PWA Splash Screen (Renders at 0ms before JS bundle execution) -->
      <div id="pwa-instant-splash" style="position:fixed;inset:0;background:#090a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;">
        <div style="position:relative;width:96px;height:96px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;">
          <img src="/favicon.svg" alt="Ali Akhmad Fauzie Logo" width="84" height="84" style="object-fit:contain;filter:drop-shadow(0 0 16px rgba(249,115,22,0.6));" />
        </div>
        <div style="font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;">ALI AKHMAD FAUZIE</div>
        <div style="font-size:11px;font-family:'Fira Code',monospace;color:#f97316;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px;">SOLUTION ARCHITECT</div>
        <div style="width:120px;height:2px;background:#1a1e2b;border-radius:2px;overflow:hidden;">
          <div style="width:40%;height:100%;background:linear-gradient(90deg,#f97316,#06b6d4);animation:splashPulse 1s infinite alternate;"></div>
        </div>
        <style>
          @keyframes splashPulse { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
